name: CI

# B0-09 (hop-dong.md, ghi-chu-pins.md). Mọi `uses:` ghim SHA 40 ký tự kèm chú
# thích tag; bằng chứng `git ls-remote` / `docker buildx imagetools inspect`
# nằm trong báo cáo phiên (không lặp lại ở đây để tránh trôi khi tag đổi).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Không có `edited`: job `commits` (cần chạy lại khi tiêu đề PR đổi, NO-110) ở `commits.yml` riêng —
    # `edited` ở đây sẽ sinh check run trùng tên `skipped` cho tám job (NO-182, /merge-review DEBT-02 W1 #1).
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# PERF-01 B-pyc: `uv sync` biên dịch .pyc ngay lúc cài, một lần cho mọi job.
# Không có nó, mỗi tiến trình Python của job tự biên dịch lúc import lần đầu và
# venv của runner bị bỏ sau job, nên khoản đó trả lại mỗi lần — đo ở container
# cổng: collection của pytest 211 s khi venv chưa có bytecode, 25 s khi đã có.
env:
  UV_COMPILE_BYTECODE: "1"

jobs:
  # PR chỉ đổi tài liệu (`job.sh changes`, `_is_docs_only_path`) → tám job dưới "skipped", check bắt
  # buộc tính là đạt, khỏi 20+ phút runner. push/workflow_dispatch luôn chạy đủ cổng.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # commit gộp thử của PR + cha 1 (đầu nhánh đích)
          persist-credentials: false # job chỉ đọc, không push (/merge-review #15)
      - id: changes
        run: bash tools/ci/job.sh changes

  # Job cổng chỉ chờ `changes` (quyết có chạy hay không, fail-closed) — đọc cùng một commit, không
  # job nào ăn đầu ra của job khác; nối chuỗi chỉ để "gọn" sẽ biến một job chậm hoặc hạ tầng hỏng
  # thành nhiều job "skipped", tức phán quyết bị che chứ không phải phán quyết xanh. Ngoại lệ là
  # phụ thuộc dữ liệu THẬT: `coverage` gộp `.coverage.*` của mọi shard + junit perf; `contract`
  # chạy bước 7 trên mẫu golden do shard unit/integration ghi (PERF-CI: trước đây nó tự chạy lại
  # 9150 test tuần tự để có mẫu riêng, ~13 phút — đường găng của cả CI); `unit`/`integration`/`ml`
  # chỉ gom kết quả ma trận shard dưới tên check bắt buộc cũ.
  lint:
    needs: changes
    # Fail-closed: chỉ bỏ qua khi `changes` ĐẠT và báo chỉ có tài liệu. `changes` hỏng → vẫn chạy
    # đủ cổng (job "skipped" được check bắt buộc tính là đạt, nên bỏ qua khi không biết là lỗ hổng).
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks quét cả lịch sử git
          persist-credentials: false # job chỉ đọc lịch sử local, không push (/merge-review #15)
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12.12"
          cache-dependency-glob: "uv.lock"
      - run: uv sync --locked --all-packages --group dev
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: bash tools/ci/job.sh lint

  typecheck:
    needs: changes
    # Fail-closed: chỉ bỏ qua khi `changes` ĐẠT và báo chỉ có tài liệu. `changes` hỏng → vẫn chạy
    # đủ cổng (job "skipped" được check bắt buộc tính là đạt, nên bỏ qua khi không biết là lỗ hổng).
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # job chỉ đọc, không push (/merge-review #15)
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12.12"
          cache-dependency-glob: "uv.lock"
      - run: uv sync --locked --all-packages --group dev
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      # NO-105: bước 8 so với `docs/contracts/openapi.json` (bản tham chiếu ĐÃ COMMIT) — quyết
      # định "chế độ xuất" cũ (2026-09-22, hop-dong.md §4, changes/B0-09.md) hết hiệu lực từ khi có
      # bản tham chiếu commit này; `tools/ci/job.sh job_typecheck` tự ép chế độ so sánh.
      - run: bash tools/ci/job.sh typecheck

  # PERF-CI: ba nhóm test chạy thành ma trận shard (`--ci-shard=K/N` chia theo tệp, `ci_split.py`) —
  # mỗi shard một runner (unit 2, integration 5, ml 3 — đo 02/11: mỗi shard ~2-3 phút). Tên check
  # bắt buộc `unit`/`integration`/`ml` vẫn giữ: job cùng tên bên dưới chỉ đọc kết quả của ma trận.
  # Đổi số shard ở `matrix.shard` thì sửa cả `CI_SHARD` (mẫu số) và `CI_COVERAGE_JOBS` của `coverage`.
  # Shard unit/integration ghi mẫu golden (`CONTRACT_SAMPLES_DIR`, như bước 5 của cổng local) cho `contract`.
  unit-shards:
    needs: changes
    # Fail-closed: chỉ bỏ qua khi `changes` ĐẠT và báo chỉ có tài liệu. `changes` hỏng → vẫn chạy
    # đủ cổng (job "skipped" được check bắt buộc tính là đạt, nên bỏ qua khi không biết là lỗ hổng).
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      CI_SHARD: ${{ matrix.shard }}/2
      CONTRACT_SAMPLES_DIR: ${{ github.workspace }}/.cache/contract-samples
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # job chỉ đọc, không push (/merge-review #15)
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12.12"
          cache-dependency-glob: "uv.lock"
      - run: uv sync --locked --all-packages --group dev
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: bash tools/ci/job.sh unit-shards
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: cov-unit-${{ matrix.shard }}
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .coverage.*
            junit-*.xml
            trace-*.jsonl
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: samples-unit-${{ matrix.shard }}
          include-hidden-files: true
          if-no-files-found: ignore
          path: .cache/contract-samples

  integration-shards:
    needs: changes
    # Fail-closed: chỉ bỏ qua khi `changes` ĐẠT và báo chỉ có tài liệu. `changes` hỏng → vẫn chạy
    # đủ cổng (job "skipped" được check bắt buộc tính là đạt, nên bỏ qua khi không biết là lỗ hổng).
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    env:
      CI_SHARD: ${{ matrix.shard }}/5
      CONTRACT_SAMPLES_DIR: ${{ github.workspace }}/.cache/contract-samples
      APPFRONT_DIR: ${{ github.workspace }}/appfront
      # CONTRACT_NODE_DIR: không đặt ở đây (context `runner` không hợp lệ trong `env:`
      # mức job, actionlint bắt lỗi) — `job.sh` tự mặc định `$RUNNER_TEMP/contract-node`
      # đúng nguyên văn prompt [6] khi biến này chưa được đặt.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # job chỉ đọc, không push (/merge-review #15)
      - id: appfront-sha
        run: echo "sha=$(tr -d '[:space:]' < tools/contract/APPFRONT_SHA)" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12.12"
          cache-dependency-glob: "uv.lock"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20.20.2"
          cache: "npm"
          cache-dependency-path: tools/contract/package-lock.json
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mungvu999-ctrl/AppFront
          ref: ${{ steps.appfront-sha.outputs.sha }}
          path: appfront
          persist-credentials: false
      - run: uv sync --locked --all-packages --group dev
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: bash tools/ci/job.sh integration-shards
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: cov-integration-${{ matrix.shard }}
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .coverage.*
            junit-*.xml
            trace-*.jsonl
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: samples-integration-${{ matrix.shard }}
          include-hidden-files: true
          if-no-files-found: ignore
          path: .cache/contract-samples

  ml-shards:
    needs: changes
    # Fail-closed: chỉ bỏ qua khi `changes` ĐẠT và báo chỉ có tài liệu. `changes` hỏng → vẫn chạy
    # đủ cổng (job "skipped" được check bắt buộc tính là đạt, nên bỏ qua khi không biết là lỗ hổng).
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      CI_SHARD: ${{ matrix.shard }}/3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # job chỉ đọc, không push (/merge-review #15)
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12.12"
          cache-dependency-glob: "uv.lock"
      - run: uv sync --locked --all-packages --group dev
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: bash tools/ci/job.sh ml-shards
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: cov-ml-${{ matrix.shard }}
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .coverage.*
            junit-*.xml
            trace-*.jsonl

  # Ba job mang tên check bắt buộc: đạt khi mọi shard của nhóm đạt. Ma trận "skipped" (PR chỉ tài
  # liệu) → job này cũng "skipped", như trước. Shard hỏng → job chạy và hỏng (fail-closed).
  unit:
    needs: unit-shards
    if: ${{ !cancelled() && needs.unit-shards.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # job chỉ đọc, không push (/merge-review #15)
      - run: bash tools/ci/job.sh unit
        env:
          SHARDS_RESULT: ${{ needs.unit-shards.result }}

  integration:
    needs: integration-shards
    if: ${{ !cancelled() && needs.integration-shards.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # job chỉ đọc, không push (/merge-review #15)
      - run: bash tools/ci/job.sh integration
        env:
          SHARDS_RESULT: ${{ needs.integration-shards.result }}

  ml:
    needs: ml-shards
    if: ${{ !cancelled() && needs.ml-shards.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # job chỉ đọc, không push (/merge-review #15)
      - run: bash tools/ci/job.sh ml
        env:
          SHARDS_RESULT: ${{ needs.ml-shards.result }}

  # Nửa đầu bước 5b (test perf) chạy song song ở đây; `coverage` chạy `case_gate` trên junit của nó.
  perf:
    needs: changes
    # Fail-closed: chỉ bỏ qua khi `changes` ĐẠT và báo chỉ có tài liệu. `changes` hỏng → vẫn chạy
    # đủ cổng (job "skipped" được check bắt buộc tính là đạt, nên bỏ qua khi không biết là lỗ hổng).
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # job chỉ đọc, không push (/merge-review #15)
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12.12"
          cache-dependency-glob: "uv.lock"
      - run: uv sync --locked --all-packages --group dev
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: bash tools/ci/job.sh perf
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: perf
          if-no-files-found: error
          path: junit-perf.xml

  # Bước 7 trên mẫu golden mà shard unit/integration đã ghi — không chạy lại test (trước đây job
  # này tự chạy lại 9150 test tuần tự, ~13 phút, là đường găng của cả CI). Đổi lại, phán quyết hợp
  # đồng giờ cần shard unit/integration đạt; shard hỏng thì `unit`/`integration` đã đỏ.
  contract:
    needs: [unit-shards, integration-shards]
    if: ${{ !cancelled() && needs.unit-shards.result == 'success' && needs.integration-shards.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      APPFRONT_DIR: ${{ github.workspace }}/appfront
      # CONTRACT_NODE_DIR: xem chú thích ở job `integration-shards` — job.sh tự mặc định.
      CONTRACT_SAMPLES_DIR: ${{ github.workspace }}/.cache/contract-samples
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # job chỉ đọc, không push (/merge-review #15)
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12.12"
          cache-dependency-glob: "uv.lock"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20.20.2"
          cache: "npm"
          cache-dependency-path: tools/contract/package-lock.json
      - id: appfront-sha
        run: echo "sha=$(tr -d '[:space:]' < tools/contract/APPFRONT_SHA)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mungvu999-ctrl/AppFront
          ref: ${{ steps.appfront-sha.outputs.sha }}
          path: appfront
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: samples-*
          merge-multiple: true
          path: .cache/contract-samples
      - run: uv sync --locked --all-packages --group dev
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: bash tools/ci/job.sh contract

  build:
    needs: changes
    # Fail-closed: chỉ bỏ qua khi `changes` ĐẠT và báo chỉ có tài liệu. `changes` hỏng → vẫn chạy
    # đủ cổng (job "skipped" được check bắt buộc tính là đạt, nên bỏ qua khi không biết là lỗ hổng).
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      APPFRONT_REPO: ${{ github.workspace }}/appfront
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # job chỉ đọc, không push (/merge-review #15)
      - id: appfront-sha
        run: echo "sha=$(tr -d '[:space:]' < tools/contract/APPFRONT_SHA)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mungvu999-ctrl/AppFront
          ref: ${{ steps.appfront-sha.outputs.sha }}
          path: appfront
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Lộ ACTIONS_RUNTIME_TOKEN cho `docker buildx build --cache-to type=gha`
      # (job.sh chỉ bật cache khi biến này có mặt; máy người thì build thường).
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      - run: bash tools/ci/job.sh build
      # SARIF của trivy ghi trong container --rm không mount thì mất theo khi
      # container xoá — job.sh giờ mount ${{ runner.temp }}/trivy vào container
      # trivy để SARIF sống sau đó; tải lên đây (if: always() Ở MỨC STEP, [9]
      # chỉ cấm always() mức JOB, không cấm bước upload trong một job — đã kiểm
      # test quét YAML không bắt nhầm). /merge-review lượt 1 #3.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: trivy-sarif
          if-no-files-found: warn
          path: ${{ runner.temp }}/trivy/*.sarif

  coverage:
    needs: [unit-shards, integration-shards, ml-shards, perf]
    # Chạy đúng khi mọi shard test và perf ĐẠT (không `always()`); chúng bị bỏ vì PR chỉ đổi tài liệu → bỏ theo.
    if: ${{ !cancelled() && needs.unit-shards.result == 'success' && needs.integration-shards.result == 'success' && needs.ml-shards.result == 'success' && needs.perf.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Đủ mọi shard của ba ma trận — thiếu artifact nào thì merge_artifacts hỏng (fail-closed).
      CI_COVERAGE_JOBS: unit-1,unit-2,integration-1,integration-2,integration-3,integration-4,integration-5,ml-1,ml-2,ml-3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # job chỉ đọc, không push (/merge-review #15)
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
