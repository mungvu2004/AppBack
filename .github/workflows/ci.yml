name: CI

# B0-09 (hop-dong.md, ghi-chu-pins.md). Mọi `uses:` ghim SHA 40 ký tự kèm chú
# thích tag; bằng chứng `git ls-remote` / `docker buildx imagetools inspect`
# nằm trong báo cáo phiên (không lặp lại ở đây để tránh trôi khi tag đổi).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Chỉ `coverage` có `needs:`. Tám job kia (lint, typecheck, unit, integration,
  # ml, contract, build, commits) đọc cùng một commit và không job nào ăn đầu ra
  # của job khác — nối chuỗi chỉ để "gọn" sẽ biến một job chậm hoặc hạ tầng hỏng
  # (mạng, Docker) thành tám job "skipped", tức tám phán quyết bị che chứ không
  # phải tám phán quyết xanh. `coverage` là ngoại lệ THẬT: nó cần `.coverage.*`
  # của cả ba job test để gộp và tính ngưỡng — không thể tính trước khi cả ba
  # xong, đây là phụ thuộc dữ liệu, không phải quy ước.
  #
  # `contract` tự chạy lại `pytest --ci-split=unit,integration` dù `unit` và
  # `integration` đã chạy các test đó rồi. Đây KHÔNG phải trùng lặp vô ích: nó
  # sinh mẫu golden (`CONTRACT_SAMPLES_DIR`) để so với BE-BIND ngay trong job
  # này, độc lập với kết quả của `integration` — một job đỏ vì lý do hạ tầng
  # (Testcontainers, mạng) không được che phán quyết hợp đồng của job kia, và
  # ngược lại. Repo này public (K4): phút CI không tính phí, nên phí thời gian
  # máy nhỏ hơn giá trị của hai phán quyết độc lập.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks quét cả lịch sử git
          persist-credentials: false # job chỉ đọc lịch sử local, không push (/merge-review #15)
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12.12"
          cache-dependency-glob: "uv.lock"
      - run: uv sync --locked --all-packages --group dev
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: bash tools/ci/job.sh lint

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # job chỉ đọc, không push (/merge-review #15)
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12.12"
          cache-dependency-glob: "uv.lock"
      - run: uv sync --locked --all-packages --group dev
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      # Bước 8 chạy Ở CHẾ ĐỘ XUẤT (không --compare openapi.json): openapi.json
      # bị .gitignore và cấm commit (BE-00 §13.2), nên chế độ so sánh luôn đỏ
      # trên `main`. Quyết định đã duyệt 2026-09-22 (hop-dong.md §4), nêu ở
      # changes/B0-09.md — Nợ NO ghi bởi người điều phối khi hợp nhất.
      - run: bash tools/ci/job.sh typecheck

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # job chỉ đọc, không push (/merge-review #15)
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12.12"
          cache-dependency-glob: "uv.lock"
      - run: uv sync --locked --all-packages --group dev
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: bash tools/ci/job.sh unit
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: cov-unit
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .coverage.*
            junit-unit.xml
            trace-unit.jsonl

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APPFRONT_DIR: ${{ github.workspace }}/appfront
      # CONTRACT_NODE_DIR: không đặt ở đây (context `runner` không hợp lệ trong `env:`
      # mức job, actionlint bắt lỗi) — `job.sh` tự mặc định `$RUNNER_TEMP/contract-node`
      # đúng nguyên văn prompt [6] khi biến này chưa được đặt.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # job chỉ đọc, không push (/merge-review #15)
      - id: appfront-sha
        run: echo "sha=$(tr -d '[:space:]' < tools/contract/APPFRONT_SHA)" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12.12"
          cache-dependency-glob: "uv.lock"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20.20.2"
          cache: "npm"
          cache-dependency-path: tools/contract/package-lock.json
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mungvu2004/AppFront
          ref: ${{ steps.appfront-sha.outputs.sha }}
          path: appfront
          persist-credentials: false
      - run: uv sync --locked --all-packages --group dev
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: bash tools/ci/job.sh integration
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: cov-integration
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .coverage.*
            junit-integration.xml
            trace-integration.jsonl

  ml:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # job chỉ đọc, không push (/merge-review #15)
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12.12"
          cache-dependency-glob: "uv.lock"
      - run: uv sync --locked --all-packages --group dev
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: bash tools/ci/job.sh ml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: cov-ml
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .coverage.*
            junit-ml.xml
            trace-ml.jsonl

  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APPFRONT_DIR: ${{ github.workspace }}/appfront
      # CONTRACT_NODE_DIR: xem chú thích ở job `integration` — job.sh tự mặc định.
      CONTRACT_SAMPLES_DIR: ${{ github.workspace }}/.cache/contract-samples
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # job chỉ đọc, không push (/merge-review #15)
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12.12"
          cache-dependency-glob: "uv.lock"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20.20.2"
          cache: "npm"
          cache-dependency-path: tools/contract/package-lock.json
      - id: appfront-sha
        run: echo "sha=$(tr -d '[:space:]' < tools/contract/APPFRONT_SHA)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mungvu2004/AppFront
          ref: ${{ steps.appfront-sha.outputs.sha }}
          path: appfront
          persist-credentials: false
      - run: uv sync --locked --all-packages --group dev
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: bash tools/ci/job.sh contract

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APPFRONT_REPO: ${{ github.workspace }}/appfront
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # job chỉ đọc, không push (/merge-review #15)
      - id: appfront-sha
        run: echo "sha=$(tr -d '[:space:]' < tools/contract/APPFRONT_SHA)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mungvu2004/AppFront
          ref: ${{ steps.appfront-sha.outputs.sha }}
          path: appfront
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Lộ ACTIONS_RUNTIME_TOKEN cho `docker buildx build --cache-to type=gha`
      # (job.sh chỉ bật cache khi biến này có mặt; máy người thì build thường).
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      - run: bash tools/ci/job.sh build
      # SARIF của trivy ghi trong container --rm không mount thì mất theo khi
      # container xoá — job.sh giờ mount ${{ runner.temp }}/trivy vào container
      # trivy để SARIF sống sau đó; tải lên đây (if: always() Ở MỨC STEP, [9]
      # chỉ cấm always() mức JOB, không cấm bước upload trong một job — đã kiểm
      # test quét YAML không bắt nhầm). /merge-review lượt 1 #3.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: trivy-sarif
          if-no-files-found: warn
          path: ${{ runner.temp }}/trivy/*.sarif

  commits:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Không nội suy ${{ github.event.* }} vào `run:` (SEC — CodeQL bắt lỗi
      # này): giá trị đi qua biến môi trường, `tools.ci.commits` tự đọc lại.
      EVENT: ${{ github.event_name }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      HEAD_REF: ${{ github.head_ref || github.ref_name }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false # job chỉ đọc lịch sử local, không push (/merge-review #15)
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12.12"
          cache-dependency-glob: "uv.lock"
      - run: uv sync --locked --all-packages --group dev
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: bash tools/ci/job.sh commits

  coverage:
    needs: [unit, integration, ml]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # job chỉ đọc, không push (/merge-review #15)
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12.12"
          cache-dependency-glob: "uv.lock"
      - run: uv sync --locked --all-packages --group dev
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cov-unit
          path: artifacts/unit
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cov-integration
          path: artifacts/integration
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cov-ml
          path: artifacts/ml
      - run: bash tools/ci/job.sh coverage
