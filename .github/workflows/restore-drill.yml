name: Restore drill

# B0-10 [6]: diễn tập khôi phục hằng tuần trên compose ci.yml, để chắc backup.sh
# và restore.sh còn khớp nhau. Không đụng máy thật (chưa có VPS).
on:
  schedule:
    - cron: "30 2 * * 0" # Chủ nhật 02:30 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  drill:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      - run: bash tools/ci/job.sh build --no-scan
      - run: bash deploy/scripts/drill.sh
