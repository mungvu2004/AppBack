  "95fe5545e493c23750ef7b055510f823a691b42e", # apps/api/quality/tests/test_routes_straighten.py, generic-api-key
  "2857e22dc460f8a6f1b5c21c6993e7f33a73612b", # apps/api/users/tests/test_e2e.py, generic-api-key
  "7587f462fd5a02173dd92f6dac45ad586a9aa748", # apps/api/users/tests/test_e2e.py, generic-api-key
  "35c3020c21f63433237e88a0e4b6066056974189", # apps/api/me/tests/test_replace_avatar_route.py, generic-api-key
  "ad3aa964a3443f946aa851efd5119987c7efaef8", # auth_recovery/tests/test_e2e.py + mail/tests/test_settings.py, generic-api-key
