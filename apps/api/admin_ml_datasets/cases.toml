# Bảng case bắt buộc thêm của dataset ML (B6-02 [8], CASE.md §2.3).
#
# `ml_list_datasets`, `ml_list_dataset_versions` (Loại A) không cần khai gì: case của Loại đã
# đủ, tính từ metadata route + BE-BIND (C07 khoá `admin`; C08 cho đường có `{…}`; C15 cho
# danh sách; C17 cho trường ⇔ trạng thái). `ml_create_dataset`, `ml_build_dataset_version`
# thêm C14 (tranh chấp ghi song song, K18) — `ml_create_dataset` còn thêm C16 (`name` NFD/NFC,
# chuỗi người nhập, giống `label` của `ml_upload_version` ở B6-01).

[[endpoint]]
op = "ml_create_dataset"
extra = ["C14", "C16"]

[[endpoint]]
op = "ml_build_dataset_version"
extra = ["C14"]

[[task]]
fn = "build_dataset_version"
require = ["J02", "J03", "J05", "J08", "J09"]

[[task]]
fn = "sweep_dataset_version_builds"
require = ["J07"]
