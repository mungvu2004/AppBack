# Bảng case bắt buộc thêm/miễn của module tầng (B2-03 [8], CASE.md §2.3).
#
# `floors_list_floors` (Đ) không cần khai gì: case của Loại đã đủ, tính từ metadata + BE-BIND.
# `floors_create_floor`, `floors_patch_spatial_floor` (G) cũng không cần khai gì.

[[endpoint]]
op = "floors_delete_floor"
# DELETE không có thân, không có chuỗi người nhập → không có case NFD để kiểm.
waive = { C16 = "DELETE không có thân, không có chuỗi người nhập" }

[[endpoint]]
op = "floors_reorder_floors"
# Thân chỉ có mảng id tầng, không có chuỗi người nhập; #13 là case thêm cố định của [8].
extra = ["C14"]
waive = { C16 = "thân chỉ có id tầng, không có chuỗi người nhập" }
