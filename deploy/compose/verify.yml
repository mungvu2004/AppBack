# Cổng verify — ENV §2, B0-01 [6]B. Gọi qua tools/verify/run.sh, không gọi trực
# tiếp (project name, biến môi trường, mount đường Windows do run.sh dựng).
services:
  verify:
    # Tên cố định (NO-108): mọi worktree dùng chung một ảnh thay vì tự sinh
    # `appback-verify-<worktree>-verify` theo project compose (`-p` của run.sh)
    # — đo 2026-09-24: 52 ảnh, 42 volume 76,6 GB do mỗi worktree một bản riêng.
    image: appback-verify:local
    build:
      context: ../..
      dockerfile: deploy/docker/verify.Dockerfile
    network_mode: bridge
    extra_hosts:
      - "host.docker.internal:host-gateway"
    working_dir: /tmp/w
    volumes:
      - ${VERIFY_SRC_DIR}:/src:ro
      - ${VERIFY_APPFRONT_DIR}:/appfront:ro
      - ${VERIFY_CONTRACT_SAMPLES_DIR}:/src-out/contract-samples
      - /var/run/docker.sock:/var/run/docker.sock
      - appback-work:/work
    environment:
      - VERIFY_NAME
      - VERIFY_BRANCH
      - VERIFY_CHANGED
      - VERIFY_VALID_NAMES
      - VERIFY_OUT_DIR=/src-out
      - APPFRONT_DIR=/appfront
      - CONTRACT_SAMPLES_DIR=/tmp/contract-samples
      - CONTRACT_NODE_DIR=/work/contract-node
      - CASE_TRACE_FILE=/tmp/case-trace.jsonl
      - UV_CACHE_DIR=/work/uv-cache
      - UV_LINK_MODE=hardlink
      - UV_PROJECT_ENVIRONMENT=/work/venv-${VERIFY_NAME}
      - MYPY_CACHE_DIR=/work/mypy-${VERIFY_NAME}
      - RUFF_CACHE_DIR=/tmp/ruff-cache
      - COVERAGE_FILE=/tmp/.coverage
      - TESTCONTAINERS_HOST_OVERRIDE=host.docker.internal
      # Nối thẳng IP bridge của container dịch vụ, không qua bộ chuyển tiếp cổng của Docker Desktop
      # trên Windows (từ chối hàng loạt, kẹt ~69 s — NO-007, FIX-009). Cùng mạng `bridge` nên tới được.
      - TESTCONTAINERS_CONNECTION_MODE=bridge_ip
      - PYTHONUNBUFFERED=1

volumes:
  # Tên cố định (NO-108): compose nếu không có `name:` tự gắn tiền tố project
  # (`appback-verify-<VERIFY_NAME>_appback-work`) — một volume riêng mỗi worktree
  # thay vì một volume `/work` dùng chung, làm UV_LINK_MODE=hardlink mất tác dụng
  # (uv-cache không còn chung để hardlink). Cache `contract-node/<băm lock>` bên
  # trong volume này đã tự tách theo băm nội dung + đổi tên nguyên tử
  # (tools/contract/runner_client.py `publish`), nên nhiều lượt verify song song
  # (khác worktree) cùng làm ấm volume chung này không giẫm nhau.
  appback-work:
    name: appback-work
