# Lớp thứ hai (lưới dự phòng) cho token /api/files/{token} (NO-197, BE-00 §8): lỗi xảy ra
# TRƯỚC khi nginx chọn location (400 header hỏng, 414) không đi qua `access_log off` của
# location /api/files/ nên nginx ghi nguyên request line vào access log mặc định. Map này
# (include ở mức http từ hai template app) cho `access_log … if=$appback_access_log` ở mức
# server bỏ mọi dòng có "files/" trong URI thô. Quyết định chính vẫn ở location (trên $uri
# đã chuẩn hoá — NO-095): map chỉ bắt thêm các lỗi tiền-location, không thay location.
map $request_uri $appback_access_log {
    default 1;
    "~*files/" 0;
}
