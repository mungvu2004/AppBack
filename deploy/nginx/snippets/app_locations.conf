# Danh sách location dùng chung giữa server app của dev (8080) và prod (8443),
# để không lặp (RULE-CODE R-07). Include bằng đường tuyệt đối từ template.
client_max_body_size 8m;
set $api http://api:8000;

error_page 413 /__errors/413;
error_page 502 503 504 =503 /__errors/503;

location /api/ {
    include /etc/nginx/appback/snippets/proxy_common.conf;
    proxy_pass $api;
}

location /api/streams/ {
    include /etc/nginx/appback/snippets/proxy_common.conf;
    proxy_buffering off;
    proxy_cache off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_read_timeout 1h;
    proxy_pass $api;
}

# Token /api/files/{token} là quyền đọc file, không vào log (BE-00 §8).
# Quyết định ở MỨC LOCATION, trên $uri đã chuẩn hoá, chứ không đoán dạng thô của
# $request_uri bằng regex ở mức server như bản cũ: nginx chuẩn hoá path trước khi
# chọn location, nên `/api/./files/…`, `/api/x/../files/…`, `/%61pi/files/…`,
# `/api%2Ffiles/…` đều tới ĐÂY mà regex cũ bỏ lọt (NO-095 — vá triệu chứng, R-19).
# `access_log off` một mình không đủ: khi api không tới được, error_page chuyển
# hướng nội bộ và nginx ghi log theo location ĐÍCH (đã kiểm bằng chạy thực), nên
# location này trỏ error_page sang hai đích riêng cũng tắt log.
# access_log chỉ chữa log truy cập: mỗi lần api không tới được (DNS lỗi, connect()
# failed — mọi lúc api khởi động lại), nginx còn ghi nguyên dòng
# "request: GET /api/files/<token> …" vào error log (BE-00 §8, review 2026-09-22
# #2, probe Q2); nâng mức error_log của chính location này lên crit để bỏ dòng đó
# (đường error log thật của ảnh nền là /var/log/nginx/error.log, đo bằng docker
# logs — nginxinc symlink ra stderr).
location /api/files/ {
    access_log off;
    error_log /var/log/nginx/error.log crit;
    error_page 413 /__errors/413-files;
    error_page 502 503 504 =503 /__errors/503-files;
    include /etc/nginx/appback/snippets/proxy_common.conf;
    proxy_pass $api;
}

location = /api/admin/ml/model-versions {
    include /etc/nginx/appback/snippets/proxy_common.conf;
    client_max_body_size 512m;
    proxy_request_buffering off;
    proxy_pass $api;
}

location / {
    include /etc/nginx/appback/snippets/security_headers.conf;
    try_files $uri /index.html;
}

location /assets/ {
    include /etc/nginx/appback/snippets/security_headers.conf;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

location /draco/ {
    include /etc/nginx/appback/snippets/security_headers.conf;
    try_files $uri =404;
}

location = /index.html {
    include /etc/nginx/appback/snippets/security_headers.conf;
    add_header Cache-Control "no-cache" always;
}

# W7: thân lỗi của chính nginx (không proxy_intercept_errors — 503
# IDEMPOTENCY_IN_PROGRESS của app phải tới FE nguyên vẹn).
location = /__errors/413 {
    include /etc/nginx/appback/snippets/error_413_body.conf;
}

location = /__errors/503 {
    include /etc/nginx/appback/snippets/error_503_body.conf;
}

# Bản sinh đôi cho /api/files/: thân y hệt, chỉ thêm access_log off (NO-095).
location = /__errors/413-files {
    access_log off;
    include /etc/nginx/appback/snippets/error_413_body.conf;
}

location = /__errors/503-files {
    access_log off;
    include /etc/nginx/appback/snippets/error_503_body.conf;
}
