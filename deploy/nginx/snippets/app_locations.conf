# Danh sách location dùng chung giữa server app của dev (8080) và prod (8443),
# để không lặp (RULE-CODE R-07). Include bằng đường tuyệt đối từ template.
client_max_body_size 8m;
set $api http://api:8000;

# access_log off; TRONG location /api/files/ không đủ: khi api không tới được,
# error_page chuyển hướng nội bộ sang /__errors/503 và nginx ghi log theo
# location ĐÍCH (đã kiểm bằng chạy thực), làm lộ lại đường /api/files/ dùng
# access_log của location gốc. Đặt điều kiện ở mức server (không bị đổi khi
# chuyển hướng nội bộ trong cùng server) qua $appback_access_log (khai ở
# template, map trên $request_uri). access_log chỉ chữa log truy cập: mỗi lần
# api không tới được (DNS lỗi, connect() failed — mọi lúc api khởi động lại),
# nginx còn ghi nguyên dòng "request: GET /api/files/<token> …" vào error log
# (BE-00 §8, review 2026-09-22 #2, probe Q2); nâng mức error_log của chính
# location này lên crit để bỏ dòng đó (đường error log thật của ảnh nền là
# /var/log/nginx/error.log, đo bằng docker logs — nginxinc symlink ra stderr).
access_log /var/log/nginx/access.log main if=$appback_access_log;

error_page 413 /__errors/413;
error_page 502 503 504 =503 /__errors/503;

location /api/ {
    include /etc/nginx/appback/snippets/proxy_common.conf;
    proxy_pass $api;
}

location /api/streams/ {
    include /etc/nginx/appback/snippets/proxy_common.conf;
    proxy_buffering off;
    proxy_cache off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_read_timeout 1h;
    proxy_pass $api;
}

location /api/files/ {
    error_log /var/log/nginx/error.log crit;
    include /etc/nginx/appback/snippets/proxy_common.conf;
    proxy_pass $api;
}

location = /api/admin/ml/model-versions {
    include /etc/nginx/appback/snippets/proxy_common.conf;
    client_max_body_size 512m;
    proxy_request_buffering off;
    proxy_pass $api;
}

location / {
    include /etc/nginx/appback/snippets/security_headers.conf;
    try_files $uri /index.html;
}

location /assets/ {
    include /etc/nginx/appback/snippets/security_headers.conf;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

location /draco/ {
    include /etc/nginx/appback/snippets/security_headers.conf;
    try_files $uri =404;
}

location = /index.html {
    include /etc/nginx/appback/snippets/security_headers.conf;
    add_header Cache-Control "no-cache" always;
}

# W7: thân lỗi của chính nginx (không proxy_intercept_errors — 503
# IDEMPOTENCY_IN_PROGRESS của app phải tới FE nguyên vẹn).
location = /__errors/413 {
    internal;
    default_type application/json;
    add_header X-Request-Id $appback_request_id always;
    return 413 '{"code":"PAYLOAD_TOO_LARGE","requestId":"$appback_request_id"}';
}

location = /__errors/503 {
    internal;
    default_type application/json;
    add_header Retry-After 5 always;
    add_header X-Request-Id $appback_request_id always;
    return 503 '{"code":"DEPENDENCY_UNAVAILABLE","requestId":"$appback_request_id"}';
}
