# Thân 413 của chính nginx (W7). Tách riêng vì có HAI location dùng chung nó:
# /__errors/413 (mặc định, vẫn vào access log) và /__errors/413-files (đích của
# error_page trong location /api/files/, có access_log off để token không lọt
# vào log qua chuyển hướng nội bộ — NO-095). Chép thân ra hai chỗ là R-07.
internal;
default_type application/json;
add_header X-Request-Id $appback_request_id always;
return 413 '{"code":"PAYLOAD_TOO_LARGE","requestId":"$appback_request_id"}';
