# Thân 503 của chính nginx (W7) — dùng chung cho /__errors/503 và
# /__errors/503-files, xem error_413_body.conf.
internal;
default_type application/json;
add_header Retry-After 5 always;
add_header X-Request-Id $appback_request_id always;
return 503 '{"code":"DEPENDENCY_UNAVAILABLE","requestId":"$appback_request_id"}';
