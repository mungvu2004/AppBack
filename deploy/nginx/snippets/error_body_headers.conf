# Bộ header nền B0-06 cho thân lỗi do chính nginx sinh (413/503). Location /__errors/* có add_header
# riêng nên không thừa kế header cấp server (nginx thay chứ không cộng) — include từ error_{413,503}_body.conf (SEC-060).
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy same-origin always;
add_header X-Frame-Options DENY always;
add_header Cache-Control no-store always;
add_header X-Request-Id $appback_request_id always;
