# Header dùng chung cho mọi location proxy_pass tới api/worker/minio phía sau nginx.
# Include trực tiếp trong từng location: một add_header/proxy_set_header riêng
# trong location sẽ làm mất hết thừa kế từ server (BE-00 §11).
# Host lấy từ biến $appback_proxy_host (server app đặt = $host để chuẩn hoá bỏ
# cổng; vhost MinIO đặt = $http_host để giữ nguyên cả cổng — chữ ký SigV4 tính
# trên Host thật). Đặt riêng biến này ở đây để vhost MinIO include được snippet
# này mà không còn gửi hai header Host trùng (đã kiểm bằng chạy thực — 400).
proxy_set_header Host $appback_proxy_host;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-Id $appback_request_id;
# Đổi phiên bản không gián đoạn (NO-117). `proxy_pass $api` dùng BIẾN nên nginx
# giải "api" lúc chạy qua `resolver` và gom mọi địa chỉ trả về thành một nhóm
# upstream tạm — lúc `deploy.sh` scale api=2 thì đó là hai container. Nhờ vậy
# `proxy_next_upstream` có tác dụng thật: container cũ bị dừng giữa chừng →
# nginx thử địa chỉ còn lại thay vì trả 502 cho client.
#
# KHÔNG dùng khối `upstream {}` như ô nợ gợi ý: nginx bản mã nguồn mở giải tên
# trong `upstream` MỘT LẦN lúc nạp cấu hình và không bao giờ giải lại (tham số
# `resolve` chỉ có ở NGINX Plus). Container api thay bản là đổi IP, nên
# `upstream {}` sẽ khoá chết vào IP đã chết — hỏng hơn hẳn hiện trạng.
#
# 1s đủ rộng cho một kết nối TCP trong cùng bridge của Docker (đo: dưới 1 ms);
# giữ 5s như cũ nghĩa là mỗi lần trúng container đang bị gỡ khỏi mạng thì client
# treo 5s trước khi được thử địa chỉ khác.
proxy_connect_timeout 1s;
proxy_next_upstream error timeout;
proxy_next_upstream_tries 2;
proxy_next_upstream_timeout 5s;
