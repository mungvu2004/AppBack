# Header bảo mật cho location phục vụ SPA. Snippet tĩnh (không ${...}); giá trị
# theo môi trường (gốc S3 trong CSP, HSTS chỉ ở prod) đi qua biến nginx khai ở
# từng template (map $csp_s3_origin, map $hsts_header) — xem templates/dev|prod.
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy same-origin always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: $csp_s3_origin; connect-src 'self' $csp_s3_origin; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header Strict-Transport-Security $hsts_header always;
