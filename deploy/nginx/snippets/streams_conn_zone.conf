# Vùng đếm luồng SSE mở đồng thời theo IP cho `limit_conn` của location /api/streams/
# (BE-00 §11, NO-335 phương án B). Include ở mức http từ hai template app, như
# access_log_files_map.conf. 1m ≈ 16 000 IP (64 byte/khoá `$binary_remote_addr` IPv4).
limit_conn_zone $binary_remote_addr zone=appback_streams_ip:1m;
