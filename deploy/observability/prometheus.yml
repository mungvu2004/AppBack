# Cấu hình scrape cho metric của AppBack (NO-162, khối [11].5 của B7-01).
#
# Cổng exporter 9464 (`METRICS_PORT`, packages/observability/settings.py) CHỈ mở
# trong mạng compose `appback`: không dịch vụ nào publish nó ra host, nên bộ thu
# thập phải chạy trong cùng mạng và gọi thẳng tên dịch vụ. Test
# `test_compose_metrics_port_is_never_published` chốt điều đó.
#
# Worker Celery prefork phơi `/metrics` ở dải cổng `METRICS_PORT … +N-1`
# (`metrics_port_for_process`, N = `--concurrency`): job `appback-worker` liệt kê
# đủ N = 2 (mặc định `WORKER_CONCURRENCY` ở base.yml); đặt biến đó khác thì thêm
# target tương ứng. `ml` không khai: nó chỉ ở mạng `ml-internal`, bộ thu không tới được.
global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: appback-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - api:9464
        labels:
          app: api
  - job_name: appback-worker
    metrics_path: /metrics
    static_configs:
      - targets:
          - worker:9464
          - worker:9465
        labels:
          app: worker
