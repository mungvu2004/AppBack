; Alembic của AppBack (BE-00 §6.1). Lệnh chạy từ gốc repo:
;   alembic -c packages/db/alembic.ini upgrade head
; DSN đọc từ DATABASE_URL qua DatabaseSettings (không đặt sqlalchemy.url ở đây).
; Tên file và revision do `python -m packages.db.new_revision` đặt; file_template
; bỏ phần ngày của alembic vì ngày đã nằm trong revision id.
[alembic]
script_location = packages/db/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
