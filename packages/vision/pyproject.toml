[project]
name = "appback-vision"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "opencv-python-headless",
    "scikit-image",
    "pypdfium2",
    "pillow",
    "shapely",
    "appback-core",
    "appback-domain",
    "appback-ml_contracts",
]

[tool.uv]
package = false

[tool.uv.sources]
appback-core = { workspace = true }
appback-domain = { workspace = true }
appback-ml_contracts = { workspace = true }
