#   [[ignore]]
#   id = "GHSA-xxxx-xxxx-xxxx"      # id lỗ hổng theo pip-audit; alias (CVE-…) cũng khớp được
#   reason = "lý do miễn, ít nhất 10 ký tự sau khi cắt khoảng trắng đầu/cuối"
