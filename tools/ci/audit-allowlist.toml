#   cùng `id` → `tools.ci.audit` thoát 1, không đọc tiếp báo cáo pip-audit;
# - mục miễn không khớp lỗ hổng nào trong báo cáo chỉ in nhắc, không hỏng cổng;
# - lỗ hổng có `fix_versions` mà không được miễn → hỏng; lỗ hổng chưa có bản sửa chỉ được in.
